# Render Blueprint: New > Blueprint > pick this repo. Values marked `sync: false`
# are asked for in the Render dashboard during setup (never commit them).
services:
  - type: web
    name: luxestay
    runtime: node
    plan: free
    region: singapore          # keep close to the TiDB / Upstash region
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Render and TiDB run in UTC; keep "today" in IST for both Node and SQL
      - key: TZ
        value: Asia/Kolkata
      - key: DB_TIMEZONE
        value: "+05:30"

      # MySQL (TiDB Cloud Starter: Connect > "General" connection parameters)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: HBMS
      - key: DB_SSL
        value: "true"

      # Redis (Upstash: the rediss://default:...@...:6379 URL)
      - key: REDIS_URL
        sync: false

      # secrets generated by Render
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true

      # Google reCAPTCHA v2 keys registered for your *.onrender.com domain
      - key: GOOGLE_SITE_KEY
        sync: false
      - key: GOOGLE_SECRET
        sync: false

      # ImageKit (your own free account), used for hotel / room-type / ID uploads
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: imagekitUrl
        sync: false
